# Development only (lives on probe/** branches, never on main): fetches live answers of candidate
# sources so adapters are written against real data, and stores them on the same branch.
name: Probe

on:
  push:
    branches: ['probe/**']
    paths-ignore: ['probe-out/**']
  workflow_dispatch:

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Probe
        run: |
          rm -rf probe-out
          if [ -f tools/ci-probe.sh ]; then bash tools/ci-probe.sh; else node tools/explore.js tools/explore-requests.json probe-out; fi
      - name: Keep the answers on this branch
        run: |
          git config user.name "lupa-recalls"
          git config user.email "lupa-recalls@users.noreply.github.com"
          git add -A probe-out
          git commit -m "probe: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
